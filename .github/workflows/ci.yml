name: Continuous integration

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - develop

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
  PRIVATE_GITHUB_TOKEN: ${{ secrets.PRIVATE_GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Get version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.1
        with:
          versionSpec: "6.0.x"

      - name: Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@v3.1.1
        with:
          useConfigFile: true
    outputs:
      major: ${{ steps.version.outputs.major }}
      minor: ${{ steps.version.outputs.minor }}
      patch: ${{ steps.version.outputs.patch }}
      semVer: ${{ steps.version.outputs.semVer }}
      majorMinorPatch: ${{ steps.version.outputs.majorMinorPatch }}
      branchName: ${{ steps.version.outputs.branchName }}

  build-docker:
    name: Build docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs:
      - version
    steps:
      - name: Configure docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            # branch event
            type=ref,enable=true,priority=600,prefix=,suffix=,event=branch
            # tag event
            type=ref,enable=true,priority=600,prefix=,suffix=,event=tag
            # pull request event
            type=ref,enable=true,priority=600,prefix=pr-,suffix=,event=pr
            type=raw,enable=${{ github.ref_name == github.event.repository.default_branch }},value=latest
            type=raw,enable=${{ github.ref_name == github.event.repository.default_branch }},value=${{ needs.version.outputs.major }}
            type=raw,enable=${{ github.ref_name == github.event.repository.default_branch }},value=${{ needs.version.outputs.major }}.${{ needs.version.outputs.minor }}
            type=raw,enable=${{ github.ref_name == github.event.repository.default_branch }},value=${{ needs.version.outputs.majorMinorPatch }}
            type=raw,priority=1000,value=${{ needs.version.outputs.semVer }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:master
            ${{ env.IMAGE_NAME }}:develop
            type=gha
          cache-to: |
            type=gha,mode=max
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
